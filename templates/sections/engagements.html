<section class="border-y border-slate-200 bg-white/60">
  <div class="mx-auto grid max-w-7xl grid-cols-2 gap-8 px-4 py-12 sm:px-6 md:grid-cols-4">
    {% for item in engagements %}
    <div class="text-center">
      <p class="text-3xl font-extrabold tracking-tightest text-ink sm:text-4xl">{{ item.value }}</p>
      <p class="mt-2 text-sm font-medium text-muted">{{ item.label }}</p>
    </div>
    {% endfor %}
  </div>
</section>
