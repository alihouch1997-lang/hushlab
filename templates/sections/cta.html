{% from "macros.html" import btn_inverse, icon %}

<section class="relative overflow-hidden bg-gradient-to-br from-indigo-900 to-indigo-950">
  {# Blob clair en contrepoint du fond sombre. #}
  <div class="pointer-events-none absolute -right-24 -top-24 h-96 w-96 rounded-full bg-violet-500 opacity-20 blur-3xl filter" aria-hidden="true"></div>

  <div class="relative mx-auto max-w-7xl px-4 py-16 text-center sm:px-6 sm:py-20 lg:py-24">
    <h2 class="mx-auto max-w-2xl text-3xl font-extrabold leading-display tracking-tightest text-white sm:text-4xl lg:text-5xl">
      {{ sections.cta.title }}
    </h2>
    <p class="mx-auto mt-5 max-w-xl text-lg leading-relaxed text-indigo-200">
      {{ sections.cta.subtitle }}
    </p>
    <div class="mt-8 flex flex-col items-center justify-center gap-3 sm:flex-row">
      {{ btn_inverse(sections.cta.primary, url_for("accueil") ~ "#contact", "arrow-right") }}
      <a href="{{ url_for('accueil') }}#offres" class="inline-flex min-h-[44px] items-center gap-2 rounded-full border border-indigo-400/40 px-6 py-3 text-sm font-semibold text-indigo-100 transition-all duration-200 hover:-translate-y-0.5 hover:bg-white/10 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white focus-visible:ring-offset-2 focus-visible:ring-offset-indigo-900">
        {{ sections.cta.secondary }}
      </a>
    </div>
  </div>
</section>
