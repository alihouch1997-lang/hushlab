# Configuration de l'analyse statique.
#   .venv/bin/ruff check .        vérifier
#   .venv/bin/ruff check --fix .  corriger ce qui peut l'être

line-length = 100
target-version = "py311"

[lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]

[lint.per-file-ignores]
# contenu.py ne contient que de la copie éditoriale : couper les phrases pour
# tenir en 100 colonnes rendrait le texte plus pénible à relire qu'à écrire.
"contenu.py" = ["E501"]
